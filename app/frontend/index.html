<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <!-- Login view -->
    <section id="login-view" class="card">
      <h1>Task Manager</h1>
      <form id="login-form" data-testid="login-form">
        <label for="username">Usuario</label>
        <input id="username" name="username" data-testid="username-input" autocomplete="username" required />

        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" data-testid="password-input" autocomplete="current-password" required />

        <button type="submit" data-testid="login-submit">Entrar</button>
        <p id="login-error" class="error" data-testid="login-error" hidden></p>
      </form>
    </section>

    <!-- Tasks view -->
    <section id="tasks-view" class="card" hidden>
      <header class="tasks-header">
        <h1>Mis tareas</h1>
        <button id="logout-btn" data-testid="logout-button">Salir</button>
      </header>

      <form id="task-form" data-testid="task-form">
        <input id="task-title" name="title" placeholder="Nueva tarea" data-testid="task-title-input" required />
        <select id="task-priority" name="priority" data-testid="task-priority-select">
          <option value="low">Baja</option>
          <option value="medium" selected>Media</option>
          <option value="high">Alta</option>
        </select>
        <button type="submit" data-testid="task-submit">Agregar</button>
      </form>
      <p id="task-error" class="error" data-testid="task-error" hidden></p>

      <div class="filters" data-testid="task-filters">
        <button data-filter="all" class="filter-btn active" data-testid="filter-all">Todas</button>
        <button data-filter="pending" class="filter-btn" data-testid="filter-pending">Pendientes</button>
        <button data-filter="done" class="filter-btn" data-testid="filter-done">Completadas</button>
      </div>

      <ul id="task-list" data-testid="task-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
